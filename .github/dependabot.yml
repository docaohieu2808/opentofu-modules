version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: opentofu
    directories:
      - /environments/*
      - /modules/*
      - /levels/*
      # functions/custom uses the lab's own provider, never published: there is
      # nothing for Dependabot to look up and the whole run failed on it.
      - /functions/google-builtin
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /custom-provider
    schedule:
      interval: weekly
