# Proves every level of the repo on GitHub-hosted runners, on each push and once a week (so a new
# OpenTofu, provider, Go or plugin-framework release that breaks the labs shows up here first).
# Nothing here talks to a cloud: the google provider is mocked (tofu test) or given a fake access
# token for an offline `tofu plan`, and the other levels use local-only providers.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  TOFU_VERSION: 1.13.2
  TFLINT_VERSION: v0.65.0
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache
  # A fake credential: the google provider only needs *a* token to configure itself, and planning
  # new resources makes no API call.
  GOOGLE_OAUTH_ACCESS_TOKEN: fake-token-no-cloud-access

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tofu fmt
        run: tofu fmt -check -recursive -diff
      - name: tflint
        run: tflint --recursive --format compact
      - name: shellcheck
        run: shellcheck encryption/demo.sh

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: init -backend=false and validate every root module
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          for dir in environments/dev modules/* functions/google-builtin levels/l1-local-basics; do
            echo "::group::$dir"
            if tofu -chdir="$dir" init -backend=false -lockfile=readonly >/dev/null \
               && tofu -chdir="$dir" validate; then echo "ok   $dir"; else echo "FAIL $dir"; status=1; fi
            echo "::endgroup::"
          done
          exit "$status"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: tofu test (mocked google provider) on each module, run from the module directory
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for module in gcp-network gcp-compute gcp-storage; do
            echo "::group::$module"
            tofu -chdir="modules/$module" init -backend=false -lockfile=readonly >/dev/null
            tofu -chdir="modules/$module" test
            echo "::endgroup::"
          done
      - name: tofu test, L1 (real apply with random + local) and L6a (google provider functions)
        run: |
          for dir in levels/l1-local-basics functions/google-builtin; do
            echo "::group::$dir"
            tofu -chdir="$dir" init -lockfile=readonly >/dev/null
            tofu -chdir="$dir" test
            echo "::endgroup::"
          done
      - name: L4 state encryption demo (plain -> migrate -> enforced, wrong key refused)
        run: encryption/demo.sh

  plan-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_VAR_project_id: example-lab-project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Plan environments/dev with state encryption, offline
        working-directory: environments/dev
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          # The real backend is a GCS bucket; swap in the local backend for this offline run.
          printf 'terraform {\n  backend "local" {}\n}\n' > override.tf
          tofu init -lockfile=readonly >/dev/null

          # No passphrase -> the plan must be refused (there is no default to fall back on).
          if tofu plan >/dev/null 2>&1; then echo "plan ran without a passphrase"; exit 1; fi

          export TF_VAR_state_encryption_passphrase="ci-only-passphrase-0123456789"
          tofu plan -out=tfplan | tail -3
          tofu show -json tfplan | jq -e '[.resource_changes[] | select(.change.actions == ["create"])] | length == 5'
          # The saved plan file is encrypted: it is not a readable zip any more.
          if unzip -l tfplan >/dev/null 2>&1; then echo "plan file is not encrypted"; exit 1; fi

  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: custom-provider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - name: go vet and go build
        run: |
          go vet ./...
          go build -ldflags "-X main.version=ci" -o bin/terraform-provider-devops .
      - name: go test (unit + acceptance tests against a real tofu binary)
        env:
          TF_ACC: "1"
          TF_ACC_TERRAFORM_PATH: /usr/local/bin/tofu
          TF_ACC_PROVIDER_HOST: registry.opentofu.org
          TF_ACC_PROVIDER_NAMESPACE: lab
        run: |
          command -v tofu
          go test -v -count=1 ./...
      - name: Use the built provider from HCL (dev_overrides) and call its function
        working-directory: functions/custom
        run: |
          printf 'provider_installation {\n  dev_overrides {\n    "registry.opentofu.org/lab/devops" = "%s"\n  }\n  direct {}\n}\n' \
            "$GITHUB_WORKSPACE/custom-provider/bin" > "$RUNNER_TEMP/devops.tofurc"
          export TF_CLI_CONFIG_FILE="$RUNNER_TEMP/devops.tofurc"
          tofu apply -auto-approve
          tofu output -json gcp_labels | jq -e '.environment == "dev-staging" and ."team-name" == "platform-ops" and ."cost-center" == "eng-001"'
          tofu output -raw greeting_sha256 | grep -Eq '^[0-9a-f]{64}$'
          tofu destroy -auto-approve
      - name: TEMP upload generated go files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-files
          path: |
            custom-provider/go.mod
            custom-provider/go.sum
